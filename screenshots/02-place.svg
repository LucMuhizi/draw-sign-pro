<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgOrbAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="phoneInterior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="sigShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="900" height="920" fill="#f1f5f9"/>
  <circle cx="780" cy="160" r="260" fill="url(#bgOrb)"/>
  <circle cx="120" cy="780" r="220" fill="url(#bgOrbAccent)"/>

  <!-- Title strip -->
  <text x="30" y="34" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="2">STEP 03 / 04 · FIELDS</text>
  <text x="30" y="58" font-size="22" font-weight="800" fill="#0f172a">Drag fields wherever they belong on the page</text>

  <!-- Phone frame -->
  <g transform="translate(60, 90)" filter="url(#phoneShadow)">
    <rect width="380" height="800" rx="42" fill="#0f172a"/>
    <rect x="6" y="6" width="368" height="788" rx="38" fill="url(#phoneInterior)"/>
    <rect x="160" y="20" width="60" height="22" rx="11" fill="#0f172a"/>

    <!-- Top toolbar: back / filename / share + save -->
    <g transform="translate(20, 60)">
      <rect width="48" height="34" rx="10" fill="white" stroke="#e2e8f0"/>
      <path d="M22 10 L14 17 L22 24" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="190" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">lease_2024.pdf</text>
    <g transform="translate(264, 60)">
      <rect width="34" height="34" rx="10" fill="white" stroke="#e2e8f0"/>
      <path d="M11 21 L21 11 M16 6 L21 6 L21 11 M21 11 L21 21 L16 21" stroke="#475569" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(304, 60)">
      <rect width="56" height="34" rx="10" fill="url(#primaryGrad)"/>
      <text x="17" y="22" font-size="12" fill="white" font-weight="700">↓</text>
      <text x="40" y="22" font-size="11" font-weight="700" fill="white">SAVE</text>
    </g>

    <!-- Page nav + auto-detect + add row -->
    <g transform="translate(28, 108)">
      <rect width="324" height="34" rx="10" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <!-- Page nav -->
      <text x="22" y="22" font-size="11" font-weight="700" fill="#475569">‹</text>
      <text x="42" y="22" font-size="11" font-weight="700" fill="#0f172a">Page</text>
      <text x="92" y="22" font-size="13" font-weight="800" fill="#2563eb">1</text>
      <text x="104" y="22" font-size="11" fill="#94a3b8">/ 3</text>
      <text x="130" y="22" font-size="11" font-weight="700" fill="#475569">›</text>
      <!-- Auto-detect -->
      <rect x="160" y="4" width="92" height="26" rx="8" fill="#2563eb" fill-opacity="0.10"/>
      <text x="172" y="22" font-size="11" fill="#2563eb" font-weight="700">⊞</text>
      <text x="186" y="22" font-size="11" font-weight="700" fill="#2563eb">Auto-detect</text>
      <!-- Add -->
      <rect x="260" y="4" width="58" height="26" rx="8" fill="url(#primaryGrad)"/>
      <text x="289" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="white">+ Add</text>
    </g>

    <!-- Field type segmented control -->
    <g transform="translate(28, 152)">
      <rect width="324" height="30" rx="9" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <rect x="2" y="2" width="80" height="26" rx="7" fill="#2563eb"/>
      <text x="42" y="20" text-anchor="middle" font-size="9.5" font-weight="800" fill="white">SIGNATURE</text>
      <text x="115" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">TYPED</text>
      <text x="180" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">DATE</text>
      <text x="242" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">INITIALS</text>
      <text x="294" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">☑</text>
    </g>

    <!-- Document canvas -->
    <g transform="translate(28, 192)">
      <rect width="324" height="380" rx="14" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <!-- Header bar -->
      <text x="20" y="32" font-size="13" font-weight="800" fill="#0f172a">LEASE AGREEMENT</text>
      <text x="20" y="48" font-size="9" fill="#94a3b8">This agreement is made on 2026-06-23 between…</text>
      <line x1="20" y1="58" x2="304" y2="58" stroke="#e2e8f0"/>
      <!-- Body text mock -->
      <g fill="#475569" font-size="9">
        <rect x="20" y="68" width="280" height="3" rx="1.5"/>
        <rect x="20" y="76" width="260" height="3" rx="1.5"/>
        <rect x="20" y="84" width="270" height="3" rx="1.5"/>
        <rect x="20" y="92" width="240" height="3" rx="1.5"/>
        <rect x="20" y="100" width="280" height="3" rx="1.5"/>
        <rect x="20" y="116" width="270" height="3" rx="1.5"/>
        <rect x="20" y="124" width="250" height="3" rx="1.5"/>
        <rect x="20" y="132" width="280" height="3" rx="1.5"/>
        <rect x="20" y="148" width="260" height="3" rx="1.5"/>
        <rect x="20" y="156" width="280" height="3" rx="1.5"/>
        <rect x="20" y="164" width="200" height="3" rx="1.5"/>
      </g>

      <!-- Auto-detected bounding box (dashed) -->
      <rect x="190" y="180" width="100" height="48" rx="6" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="240" y="174" text-anchor="middle" font-size="8" font-weight="700" fill="#2563eb">SIGNED BY:</text>

      <!-- Placed signature overlay -->
      <g transform="translate(192, 192)">
        <rect width="92" height="34" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5" filter="url(#sigShadow)"/>
        <text x="46" y="24" text-anchor="middle" font-size="20" font-weight="400" font-style="italic" fill="#0f172a" font-family="'Brush Script MT','Lucida Handwriting',cursive">John Smith</text>
        <!-- resize handles -->
        <circle cx="0" cy="0" r="3" fill="#2563eb"/>
        <circle cx="92" cy="0" r="3" fill="#2563eb"/>
        <circle cx="0" cy="34" r="3" fill="#2563eb"/>
        <circle cx="92" cy="34" r="3" fill="#2563eb"/>
      </g>

      <!-- Date field -->
      <g transform="translate(20, 248)">
        <rect width="80" height="20" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1.4"/>
        <text x="40" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">2026-06-23</text>
      </g>

      <!-- Initials field -->
      <g transform="translate(110, 248)">
        <rect width="40" height="20" rx="4" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.4"/>
        <text x="20" y="14" text-anchor="middle" font-size="10" font-weight="800" fill="#0e7490">J.S</text>
      </g>

      <!-- Checkbox field -->
      <g transform="translate(160, 248)">
        <rect width="20" height="20" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
        <path d="M5 10 L9 14 L15 6" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="186" y="262" font-size="9" fill="#475569">I agree to the terms above</text>

      <g fill="#475569" font-size="9">
        <rect x="20" y="290" width="280" height="3" rx="1.5"/>
        <rect x="20" y="298" width="260" height="3" rx="1.5"/>
        <rect x="20" y="306" width="270" height="3" rx="1.5"/>
        <rect x="20" y="322" width="280" height="3" rx="1.5"/>
        <rect x="20" y="330" width="240" height="3" rx="1.5"/>
        <rect x="20" y="338" width="280" height="3" rx="1.5"/>
        <rect x="20" y="346" width="260" height="3" rx="1.5"/>
        <rect x="20" y="354" width="220" height="3" rx="1.5"/>
      </g>
    </g>

    <!-- Tabs row (showing 3 fields placed) -->
    <g transform="translate(28, 588)">
      <rect width="324" height="32" rx="10" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="14" y="20" font-size="10" fill="#64748b">📑</text>
      <text x="30" y="20" font-size="10" font-weight="700" fill="#475569">Templates:</text>
      <g transform="translate(94, 6)">
        <rect width="68" height="20" rx="6" fill="#2563eb" fill-opacity="0.10"/>
        <text x="34" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">★ Standard</text>
      </g>
      <g transform="translate(168, 6)">
        <rect width="78" height="20" rx="6" fill="#2563eb" fill-opacity="0.10"/>
        <text x="39" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">★ Lease v2</text>
      </g>
      <g transform="translate(252, 6)">
        <rect width="62" height="20" rx="6" fill="#2563eb" fill-opacity="0.10"/>
        <text x="31" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">+ Save</text>
      </g>
    </g>

    <!-- Download CTA -->
    <g transform="translate(28, 632)">
      <rect width="324" height="46" rx="14" fill="url(#accentGrad)" filter="url(#softShadow)"/>
      <text x="34" y="29" font-size="14" fill="white" font-weight="700">↓</text>
      <text x="56" y="29" font-size="13" font-weight="700" fill="white">Download Signed Document</text>
    </g>

    <!-- Bottom action bar -->
    <g transform="translate(20, 704)">
      <rect width="340" height="62" rx="22" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="46" y="28" text-anchor="middle" font-size="15" fill="#64748b">↑</text>
      <text x="46" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">UPLOAD</text>
      <text x="135" y="28" text-anchor="middle" font-size="15" fill="#64748b">✎</text>
      <text x="135" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">SIGN</text>
      <rect x="166" y="6" width="80" height="50" rx="16" fill="#2563eb" fill-opacity="0.14"/>
      <text x="206" y="28" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700">▭</text>
      <text x="206" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#2563eb">FIELDS</text>
      <text x="278" y="28" text-anchor="middle" font-size="15" fill="#64748b">↓</text>
      <text x="278" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">DONE</text>
    </g>
  </g>

  <!-- Annotations -->
  <g transform="translate(478, 130)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#2563eb">01</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Auto-detect signature zones</text>
    <text x="78" y="22" font-size="12" fill="#475569">OCR finds "Sign here", "Date",</text>
    <text x="78" y="38" font-size="12" fill="#475569">"Initial" markers via Tesseract.js.</text>
    <text x="78" y="54" font-size="12" fill="#475569">Tap any box to drop a field.</text>
  </g>
  <line x1="460" y1="170" x2="492" y2="170" stroke="#2563eb" stroke-width="2"/>
  <circle cx="492" cy="170" r="6" fill="#2563eb"/>

  <g transform="translate(478, 280)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#f97316">02</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">5 native field types</text>
    <text x="78" y="22" font-size="12" fill="#475569">Signature (drawn/typed/uploaded),</text>
    <text x="78" y="38" font-size="12" fill="#475569">typed name, auto-date, initials,</text>
    <text x="78" y="54" font-size="12" fill="#475569">and checkbox. All render natively</text>
    <text x="78" y="70" font-size="12" fill="#475569">in the exported PDF (pdf-lib).</text>
  </g>
  <line x1="460" y1="320" x2="492" y2="320" stroke="#f97316" stroke-width="2"/>
  <circle cx="492" cy="320" r="6" fill="#f97316"/>

  <g transform="translate(478, 460)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#22c55e">03</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Drag, pinch, resize</text>
    <text x="78" y="22" font-size="12" fill="#475569">Multi-touch gestures: drag to</text>
    <text x="78" y="38" font-size="12" fill="#475569">position, pinch to scale, corner</text>
    <text x="78" y="54" font-size="12" fill="#475569">handles to resize.</text>
  </g>
  <line x1="460" y1="500" x2="492" y2="500" stroke="#22c55e" stroke-width="2"/>
  <circle cx="492" cy="500" r="6" fill="#22c55e"/>

  <g transform="translate(478, 620)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#06b6d4">04</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Templates &amp; multi-party</text>
    <text x="78" y="22" font-size="12" fill="#475569">Save current placement as a</text>
    <text x="78" y="38" font-size="12" fill="#475569">template or invite signers via a</text>
    <text x="78" y="54" font-size="12" fill="#475569">shareable link (Supabase).</text>
  </g>
  <line x1="460" y1="680" x2="492" y2="680" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="492" cy="680" r="6" fill="#06b6d4"/>

  <g transform="translate(478, 770)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#0f172a">05</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Save PDF, manifest, share</text>
    <text x="78" y="22" font-size="12" fill="#475569">Download signed PDF with embedded</text>
    <text x="78" y="38" font-size="12" fill="#475569">signature, or push to native share</text>
    <text x="78" y="54" font-size="12" fill="#475569">sheet via @capacitor/share.</text>
  </g>
  <line x1="460" y1="800" x2="492" y2="800" stroke="#0f172a" stroke-width="2"/>
  <circle cx="492" cy="800" r="6" fill="#0f172a"/>
</svg>
