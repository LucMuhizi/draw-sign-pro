<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgOrbAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="phoneInterior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="900" height="820" fill="#f1f5f9"/>
  <circle cx="780" cy="160" r="240" fill="url(#bgOrb)"/>
  <circle cx="120" cy="700" r="220" fill="url(#bgOrbAccent)"/>

  <!-- Title strip -->
  <text x="30" y="34" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="2">STEP 02 / 04 · SIGN</text>
  <text x="30" y="58" font-size="22" font-weight="800" fill="#0f172a">Make a signature, four different ways</text>

  <!-- Phone frame -->
  <g transform="translate(60, 90)" filter="url(#phoneShadow)">
    <rect width="380" height="700" rx="42" fill="#0f172a"/>
    <rect x="6" y="6" width="368" height="688" rx="38" fill="url(#phoneInterior)"/>
    <rect x="160" y="20" width="60" height="22" rx="11" fill="#0f172a"/>

    <!-- Header (quick sign chip showing) -->
    <g transform="translate(28, 60)">
      <rect width="78" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
      <text x="39" y="15" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">QUICK SIGN</text>
    </g>
    <text x="190" y="76" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Quick Sign active</text>

    <!-- Section title -->
    <text x="190" y="124" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Create Signature</text>
    <text x="190" y="146" text-anchor="middle" font-size="11" fill="#64748b">Choose how you'd like to create your signature</text>

    <!-- My Signatures row -->
    <text x="28" y="186" font-size="11" font-weight="700" fill="#64748b">MY SIGNATURES</text>
    <g transform="translate(28, 196)">
      <rect width="80" height="44" rx="10" fill="white" stroke="#2563eb" stroke-width="2" filter="url(#softShadow)"/>
      <text x="40" y="32" text-anchor="middle" font-size="20" font-style="italic" fill="#0f172a" font-family="'Brush Script MT','Lucida Handwriting',cursive">John</text>
      <circle cx="68" cy="10" r="6" fill="#2563eb"/>
      <path d="M64 10 L67 13 L72 7" stroke="white" stroke-width="1.4" fill="none"/>
    </g>
    <g transform="translate(116, 196)">
      <rect width="80" height="44" rx="10" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="40" y="32" text-anchor="middle" font-size="20" font-style="italic" fill="#0f172a" font-family="'Brush Script MT','Lucida Handwriting',cursive">JS</text>
      <circle cx="68" cy="10" r="5" fill="#94a3b8" opacity="0"/>
    </g>
    <g transform="translate(204, 196)">
      <rect width="80" height="44" rx="10" fill="white" stroke="#e2e8f0" stroke-dasharray="4 3" filter="url(#softShadow)"/>
      <text x="40" y="32" text-anchor="middle" font-size="13" fill="#94a3b8">+ New</text>
    </g>

    <!-- Method grid: 4 cards -->
    <!-- Draw -->
    <g transform="translate(28, 256)">
      <rect width="155" height="60" rx="14" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <circle cx="32" cy="30" r="16" fill="#2563eb" fill-opacity="0.12"/>
      <text x="32" y="36" text-anchor="middle" font-size="15" fill="#2563eb">✎</text>
      <text x="62" y="28" font-size="13" font-weight="700" fill="#0f172a">Draw</text>
      <text x="62" y="44" font-size="9" fill="#64748b">Touch / stylus / mouse</text>
    </g>
    <g transform="translate(197, 256)">
      <rect width="155" height="60" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#softShadow)"/>
      <circle cx="32" cy="30" r="16" fill="#f97316" fill-opacity="0.18"/>
      <text x="32" y="36" text-anchor="middle" font-size="15" fill="#f97316">⌨</text>
      <text x="62" y="28" font-size="13" font-weight="700" fill="#0f172a">Type</text>
      <text x="62" y="44" font-size="9" fill="#f97316">Select a font style</text>
    </g>
    <g transform="translate(28, 328)">
      <rect width="155" height="60" rx="14" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <circle cx="32" cy="30" r="16" fill="#06b6d4" fill-opacity="0.14"/>
      <text x="32" y="36" text-anchor="middle" font-size="15" fill="#06b6d4">◉</text>
      <text x="62" y="28" font-size="13" font-weight="700" fill="#0f172a">Take Photo</text>
      <text x="62" y="44" font-size="9" fill="#64748b">Auto bg removal</text>
    </g>
    <g transform="translate(197, 328)">
      <rect width="155" height="60" rx="14" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <circle cx="32" cy="30" r="16" fill="#eab308" fill-opacity="0.18"/>
      <text x="32" y="36" text-anchor="middle" font-size="15" fill="#eab308">⬆</text>
      <text x="62" y="28" font-size="13" font-weight="700" fill="#0f172a">Upload</text>
      <text x="62" y="44" font-size="9" fill="#64748b">From gallery</text>
    </g>

    <!-- Live preview area (Type mode selected) -->
    <g transform="translate(28, 404)">
      <rect width="324" height="116" rx="14" fill="white" stroke="#f97316" stroke-width="1.5" filter="url(#softShadow)"/>
      <text x="20" y="22" font-size="10" font-weight="700" fill="#64748b">LIVE PREVIEW</text>
      <text x="20" y="98" font-size="44" font-style="italic" fill="#0f172a" font-family="'Brush Script MT','Lucida Handwriting',cursive">John Smith</text>
      <!-- Font selector -->
      <g transform="translate(20, 18)">
        <rect x="100" width="200" height="14" rx="7" fill="#f8fafc"/>
      </g>
    </g>
    <!-- Font selector pills -->
    <g transform="translate(28, 528)">
      <rect width="324" height="32" rx="10" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <rect x="2" y="2" width="78" height="28" rx="8" fill="#f97316" fill-opacity="0.18"/>
      <text x="41" y="20" text-anchor="middle" font-size="10" font-weight="800" fill="#f97316">SCRIPT</text>
      <text x="121" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">SERIF</text>
      <text x="200" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">SANS</text>
      <text x="280" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">MONO</text>
    </g>

    <!-- Bottom action bar -->
    <g transform="translate(58, 588)">
      <rect width="120" height="44" rx="14" fill="white" stroke="#e2e8f0" filter="url(#softShadow)"/>
      <text x="60" y="27" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Back</text>
    </g>
    <g transform="translate(192, 588)">
      <rect width="160" height="44" rx="14" fill="url(#accentGrad)" filter="url(#softShadow)"/>
      <text x="80" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="white">Confirm Signature</text>
    </g>
  </g>

  <!-- Annotations -->
  <g transform="translate(478, 130)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#2563eb">01</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Four creation methods</text>
    <text x="78" y="22" font-size="12" fill="#475569">Draw on canvas, type with live</text>
    <text x="78" y="38" font-size="12" fill="#475569">font preview, snap a photo (auto</text>
    <text x="78" y="54" font-size="12" fill="#475569">bg removal), or upload from gallery.</text>
  </g>
  <line x1="460" y1="170" x2="492" y2="170" stroke="#2563eb" stroke-width="2"/>
  <circle cx="492" cy="170" r="6" fill="#2563eb"/>

  <g transform="translate(478, 290)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#f97316">02</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Reusable signature library</text>
    <text x="78" y="22" font-size="12" fill="#475569">Save as many signatures as you</text>
    <text x="78" y="38" font-size="12" fill="#475569">need. Each is stored in IndexedDB</text>
    <text x="78" y="54" font-size="12" fill="#475569">and synced to Supabase cloud.</text>
  </g>
  <line x1="460" y1="330" x2="492" y2="330" stroke="#f97316" stroke-width="2"/>
  <circle cx="492" cy="330" r="6" fill="#f97316"/>

  <g transform="translate(478, 460)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#22c55e">03</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Quick Sign mode</text>
    <text x="78" y="22" font-size="12" fill="#475569">Once enabled, signatures auto-</text>
    <text x="78" y="38" font-size="12" fill="#475569">apply after upload using your</text>
    <text x="78" y="54" font-size="12" fill="#475569">profile's default saved signature.</text>
  </g>
  <line x1="460" y1="500" x2="492" y2="500" stroke="#22c55e" stroke-width="2"/>
  <circle cx="492" cy="500" r="6" fill="#22c55e"/>

  <g transform="translate(478, 620)">
    <text x="0" y="26" font-size="34" font-weight="800" fill="#06b6d4">04</text>
    <text x="78" y="0" font-size="17" font-weight="700" fill="#0f172a">Auto bg removal</text>
    <text x="78" y="22" font-size="12" fill="#475569">Photo-derived signatures are</text>
    <text x="78" y="38" font-size="12" fill="#475569">cleaned up automatically so the</text>
    <text x="78" y="54" font-size="12" fill="#475569">saved image is transparent PNG.</text>
  </g>
  <line x1="460" y1="680" x2="492" y2="680" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="492" cy="680" r="6" fill="#06b6d4"/>
</svg>
